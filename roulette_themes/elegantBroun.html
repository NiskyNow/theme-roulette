<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配信用ルーレット - エレガント</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* ▼▼▼ 修正 ▼▼▼ */
            gap: 40px; /* .spin-button と .result の隙間を確保 */
            /* ▲▲▲ 修正 ▲▲▲ */
        }

        .roulette-wrapper {
            -webkit-app-region: drag;
            position: relative;
            width: 550px;
            height: 550px;
            background: linear-gradient(135deg, #F5E6D3, #E8D5C4);
            border-radius: 50%;
            padding: 25px;
            box-shadow: 
                0 30px 80px rgba(139, 115, 85, 0.3),
                0 0 0 1px rgba(139, 115, 85, 0.2),
                inset 0 0 50px rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .gold-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 510px;
            height: 510px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            opacity: 0.6;
            pointer-events: none;
            z-index: 5;
        }

        .roulette {
            -webkit-app-region: no-drag;
            width: 100%;
            height: 100%;
            position: relative;
            /* transition はJS側 (roulette-svg-target) で制御 */
            border-radius: 50%;
        }

        svg {
            width: 100%;
            height: 100%;
            /* ▼▼▼ 修正 ▼▼▼ */
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            z-index: 5;
            border-radius: 50%;
            /* ▲▲▲ 修正 ▲▲▲ */
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: 
                radial-gradient(circle at 35% 35%, #FAF0E6, #E8D5C4);
            border-radius: 50%;
            border: 3px solid #B8956A;
            box-shadow: 
                0 10px 35px rgba(139, 115, 85, 0.3),
                inset 0 3px 15px rgba(255, 255, 255, 0.5),
                inset 0 -3px 10px rgba(139, 115, 85, 0.1);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .center-ornament {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            position: relative;
        }

        .center-ornament::before,
        .center-ornament::after {
            content: '';
            position: absolute;
            background: #B8956A;
        }

        .center-ornament::before {
            width: 40px;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .center-ornament::after {
            width: 2px;
            height: 40px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        .center-diamond {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #D4AF37;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .center-text {
            font-weight: 600;
            font-size: 20px;
            color: #8B7355;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .pointer {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .pointer-stem {
            width: 4px;
            height: 70px;
            background: linear-gradient(180deg, #B8956A, #8B7355);
            margin: 0 auto;
            border-radius: 2px;
            box-shadow: 
                2px 0 5px rgba(139, 115, 85, 0.3),
                -2px 0 5px rgba(139, 115, 85, 0.3);
        }

        .pointer-top {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #D4AF37, #B8956A);
            border-radius: 50%;
            margin: 0 auto 5px;
            box-shadow: 
                0 3px 8px rgba(139, 115, 85, 0.4),
                inset 0 1px 3px rgba(255, 255, 255, 0.5);
            border: 1px solid #8B7355;
        }

        .pointer-arrow {
            position: relative;
            top: -2px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #8B7355;
            margin: 0 auto;
            filter: drop-shadow(0 3px 6px rgba(139, 115, 85, 0.4));
        }

        .spin-button {
            margin-top: 65px;
            padding: 20px 65px;
            font-size: 22px;
            font-weight: 600;
            color: #5A4A3A;
            background: linear-gradient(135deg, #FAF0E6, #E8D5C4);
            border: 2px solid #B8956A;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 10px 30px rgba(139, 115, 85, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            position: relative;
        }

        .spin-button::before {
            content: '◆';
            position: absolute;
            left: 25px;
            color: #D4AF37;
            font-size: 16px;
        }

        .spin-button::after {
            content: '◆';
            position: absolute;
            right: 25px;
            color: #D4AF37;
            font-size: 16px;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(139, 115, 85, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, #FFFFFF, #FAF0E6);
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 
                0 5px 15px rgba(139, 115, 85, 0.2),
                inset 0 1px 3px rgba(139, 115, 85, 0.1);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .roulette-wrapper.spinning {
            animation: elegant-glow 1s infinite;
        }

        @keyframes elegant-glow {
            0%, 100% {
                box-shadow: 
                    0 30px 80px rgba(139, 115, 85, 0.3),
                    0 0 0 1px rgba(139, 115, 85, 0.2),
                    inset 0 0 50px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 
                    0 30px 80px rgba(139, 115, 85, 0.5),
                    0 0 0 1px rgba(212, 175, 55, 0.4),
                    inset 0 0 50px rgba(255, 255, 255, 0.5),
                    0 0 40px rgba(212, 175, 55, 0.2);
            }
        }

        .decorative-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            width: 200px;
            opacity: 0.4;
        }

        .line-top {
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-bottom {
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ▼▼▼ 修正 ▼▼▼ */
        /* 結果表示欄のスタイルを追加 */
        .result {
            font-size: 36px;
            font-weight: bold;
            color: #8B7355; /* テーマカラー */
            text-shadow: 0 1px 1px #ffffff, 0 0 10px rgba(139, 115, 85, 0.3);
            min-height: 50px;
            font-family: 'Georgia', serif;
        }
        /* ▲▲▲ 修正 ▲▲▲ */
    </style>
</head>
<body>
    <div class="container">
        <div class="decorative-line line-top"></div>
        <div class="roulette-wrapper" id="rouletteWrapper">
            <div class="gold-ring"></div>
            
            <div class="pointer">
                <div class="pointer-top"></div>
                <div class="pointer-stem"></div>
                <div class="pointer-arrow"></div>
            </div>
            
            <div class="roulette" id="roulette-body">
                <svg id="roulette-svg-target" viewBox="0 0 500 500">
                    </svg>
                <div class="center-circle">
                    <div class="center-ornament">
                        <div class="center-diamond"></div>
                    </div>
                    <div class="center-text">Spin</div>
                </div>
            </div>
        </div>
        <div class="decorative-line line-bottom"></div>
        <button class="spin-button" id="spinBtn">Start</button>
        <div class="result" id="result"></div>
        </div>

    <script src="../rouletteRenderer.js"></script>
    </body>
</html>
