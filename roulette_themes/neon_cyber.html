<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオンルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            z-index: 1;
        }

        .roulette-wrapper {
            -webkit-app-region: no-drag;
            position: relative;
            width: 550px;
            height: 550px;
            filter: drop-shadow(0 0 50px rgba(0, 255, 255, 0.5));

        }

        .roulette-border {
            -webkit-app-region: drag;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 580px;
            height: 580px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                inset 0 0 20px #00ffff;
            animation: border-pulse 2s ease-in-out infinite;
        }

        @keyframes border-pulse {
            0%, 100% {
                box-shadow: 
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    inset 0 0 20px #00ffff;
            }
            50% {
                box-shadow: 
                    0 0 30px #ff00ff,
                    0 0 60px #ff00ff,
                    inset 0 0 30px #ff00ff;
            }
        }

        .roulette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            /* transition はJS側 (roulette-svg-target) で制御 */
            overflow: hidden;
        }

        .roulette svg {
            width: 100%;
            height: 100%;
            /* ▼▼▼ 修正 ▼▼▼ */
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            z-index: 5;
            /* ▲▲▲ 修正 ▲▲▲ */
        }

        .segment-path {
            stroke: #000000;
            stroke-width: 3;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .segment-text {
            font-size: 22px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            fill: white;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 1));
        }

        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            z-index: 10;
        }

        .center-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #ff00ff;
            box-shadow: 
                0 0 15px #ff00ff,
                inset 0 0 15px #ff00ff;
            animation: spin-slow 10s linear infinite;
        }

        .center-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a3e 0%, #0a0a1e 100%);
            border: 2px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px rgba(0, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-icon {
            font-size: 28px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background: linear-gradient(180deg, #ff00ff 0%, #00ffff 100%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            box-shadow: 
                0 0 20px #ff00ff,
                0 0 40px #00ffff;
            z-index: 20;
            animation: pointer-glow 1s ease-in-out infinite alternate;
        }

        @keyframes pointer-glow {
            from {
                box-shadow: 
                    0 0 20px #ff00ff,
                    0 0 40px #00ffff;
            }
            to {
                box-shadow: 
                    0 0 30px #ff00ff,
                    0 0 60px #00ffff,
                    0 0 80px #ff00ff;
            }
        }

        .button {
            -webkit-app-region: no-drag;
            padding: 18px 70px;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            border: 3px solid #00ffff;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 
                0 0 20px #00ffff,
                0 0 40px #ff00ff,
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }

        .button::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            z-index: -1;
            filter: blur(10px);
            opacity: 0.7;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px #00ffff,
                0 0 60px #ff00ff,
                inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* ▼▼▼ 修正 ▼▼▼ */
        /* 結果表示欄のスタイルを追加 */
        .result {
            -webkit-app-region: no-drag;
            font-size: 36px;
            font-weight: bold;
            color: #00ffff; /* テーマカラー */
            text-shadow: 0 0 20px #00ffff, 0 0 30px #ff00ff;
            min-height: 50px;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }
        /* ▲▲▲ 修正 ▲▲▲ */
        
    </style>
</head>
<body>
    <div class="container">
        <div class="roulette-wrapper">
            <div class="roulette-border"></div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette-body">
                <svg viewBox="0 0 550 550" id="roulette-svg-target"></svg>
                <div class="center-hub">
                    <div class="center-outer"></div>
                    <div class="center-inner">
                        <div class="center-icon">💫</div>
                    </div>
                </div>
            </div>
        </div>
        <button class="button" id="spinBtn">START</button>
        <div class="result" id="result"></div>
        </div>

    <script src="../rouletteRenderer.js"></script>
    </body>
</html>
