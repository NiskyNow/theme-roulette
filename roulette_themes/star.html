<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かっこいいルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; /* 透過済 */
            font-family: 'Yu Gothic', 'Meiryo', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .roulette-wrapper {
            -webkit-app-region: no-drag;
            position: relative;
            width: 600px;
            height: 600px;
        }

        .outer-ring {
            -webkit-app-region: drag;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.6),
                0 0 60px rgba(255, 215, 0, 0.4),
                inset 0 0 20px rgba(255, 215, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(255, 215, 0, 0.6),
                    0 0 60px rgba(255, 215, 0, 0.4),
                    inset 0 0 20px rgba(255, 215, 0, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 40px rgba(255, 215, 0, 0.8),
                    0 0 80px rgba(255, 215, 0, 0.6),
                    inset 0 0 30px rgba(255, 215, 0, 0.5);
            }
        }

        .roulette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: #1a1a2e;
            box-shadow: 
                inset 0 0 50px rgba(0, 0, 0, 0.8),
                0 10px 40px rgba(0, 0, 0, 0.5);
            /* transition はJS側 (roulette-svg-target) で制御 */
            overflow: hidden;
        }

        .roulette svg {
            width: 100%;
            height: 100%;
            /* ▼▼▼ 修正 ▼▼▼ */
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            z-index: 5;
            /* ▲▲▲ 修正 ▲▲▲ */
        }

        .segment-path {
            stroke: #ffffff;
            stroke-width: 4;
            transition: opacity 0.3s;
        }

        .segment-text {
            font-size: 24px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            fill: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #2c2c3e 0%, #1a1a2e 70%);
            box-shadow: 
                0 0 0 8px #ffd700,
                0 0 0 12px #1a1a2e,
                0 5px 20px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .center-logo {
            width: 70%;
            height: 70%;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pointer {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid #ffd700;
            filter: drop-shadow(0 5px 15px rgba(255, 215, 0, 1));
            z-index: 20;
        }

        .button {
            -webkit-app-region: no-drag;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 10px 30px rgba(102, 126, 234, 0.5),
                inset 0 -3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(102, 126, 234, 0.7),
                inset 0 -3px 10px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            -webkit-app-region: no-drag;
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 1);
            min-height: 50px;
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 30px rgba(255, 215, 0, 1);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 0 70px rgba(255, 215, 0, 0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="roulette-wrapper">
            <div class="outer-ring"></div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette-body">
                <svg viewBox="0 0 600 600" id="roulette-svg-target"></svg>
                <div class="center-circle">
                    <div class="center-logo">⭐</div>
                </div>
            </div>
        </div>
        <button class="button" id="spinBtn">回す</button>
        <div class="result" id="result"></div>
        </div>

    <script src="../rouletteRenderer.js"></script>
    </body>
</html>
