<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <style>
        body {
            font-family: sans-serif;
            padding: 10px 20px;
            background: #f4f4f4;
        }
        h2, h3 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            margin-top: 15px;
        }
        .setting-group {
            margin-bottom: 20px;
        }
        .item-list {
            margin-bottom: 10px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .item-row input[type="text"] {
            flex-grow: 1;
        }
        .item-row input[type="number"] {
            width: 70px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        #save-status {
            color: green;
            font-weight: bold;
        }
        /* ▼▼▼ 追加 ▼▼▼ */
        #theme-select {
            width: 100%;
            padding: 8px;
            font-size: 16px;
        }
        /* ▲▲▲ 追加 ▲▲▲ */
    </style>
</head>
<body>
    <h2>設定</h2>

    <div class="setting-group">
        <h3>テーマ選択</h3>
        <select id="theme-select">
            <option value="arcade">アーケード</option>
            <option value="wahu">和風</option>
            <option value="neon_cyber">ネオンサイバー</option>
            <option value="steampunk">スチームパンク</option>
            <option value="candy">キャンディ</option>
            <option value="star">スター</option>
            <option value="pastelPink">パステルピンク (SVG)</option>
            <option value="elegantBroun">エレガント (SVG)</option>
        </select>
    </div>
    <div class="setting-group">
        <h3>ルーレット項目</h3>
        <div id="item-list-container" class="item-list">
            </div>
        <div class="controls">
            <button id="add-item-btn">項目を追加</button>
        </div>
    </div>

    <div class="setting-group">
        <h3>その他</h3>
        <div>
            <input type="checkbox" id="fake-spin-check">
            <label for="fake-spin-check">フェイク動作を有効にする</label>
        </div>
    </div>

    <hr>

    <button id="save-btn">保存してリロード</button>
    <span id="save-status"></span>

    <script src="./settingsRenderer.js"></script>
</body>
</html>
