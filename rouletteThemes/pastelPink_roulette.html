<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配信用ルーレット - パステル (SVG版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .roulette-wrapper {
            position: relative;
            width: 550px;
            height: 550px;
            background: linear-gradient(135deg, #FFF5F7, #FFF0F5);
            border-radius: 50%;
            padding: 25px;
            box-shadow: 
                0 20px 60px rgba(255, 182, 193, 0.4),
                0 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .roulette {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.05, 1);
        }

        /* canvas から svg に変更 */
        svg {
            width: 100%;
            height: 100%;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #FFFFFF, #FFF5F7);
            border-radius: 50%;
            border: 6px solid #FFB6C1;
            box-shadow: 
                0 8px 25px rgba(255, 182, 193, 0.3),
                inset 0 2px 10px rgba(255, 182, 193, 0.1);
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 26px;
            color: #FF69B4;
            letter-spacing: 2px;
        }

        .pointer {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-top: 85px solid #FF69B4;
            filter: drop-shadow(0 5px 15px rgba(255, 105, 180, 0.4));
            z-index: 20;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -95px;
            left: -16px;
            width: 32px;
            height: 32px;
            background: #FF69B4;
            border-radius: 50%;
            border: 4px solid #FFFFFF;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        .spin-button {
            margin-top: 60px;
            padding: 22px 70px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 
                0 10px 30px rgba(255, 105, 180, 0.3),
                0 0 0 4px rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(255, 105, 180, 0.4),
                0 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .roulette-wrapper.spinning {
            animation: glow 0.8s infinite;
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 
                    0 20px 60px rgba(255, 182, 193, 0.4),
                    0 0 0 8px rgba(255, 255, 255, 0.5);
            }
            50% {
                box-shadow: 
                    0 20px 60px rgba(255, 182, 193, 0.7),
                    0 0 0 8px rgba(255, 255, 255, 0.8),
                    0 0 40px rgba(255, 182, 193, 0.5);
            }
        }

        .deco-circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 182, 193, 0.3);
            pointer-events: none;
        }

        .deco-1 {
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .deco-2 {
            width: 520px;
            height: 520px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="roulette-wrapper" id="rouletteWrapper">
            <div class="deco-circle deco-1"></div>
            <div class="deco-circle deco-2"></div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette">
                <svg id="rouletteSvg" viewBox="0 0 500 500"></svg>
                <div class="center-circle">SPIN</div>
            </div>
        </div>
        <button class="spin-button" id="spinButton">START</button>
    </div>

    <script>
        // const canvas = document.getElementById('rouletteCanvas'); // 削除
        // const ctx = canvas.getContext('2d'); // 削除
        const svg = document.getElementById('rouletteSvg'); // SVGを取得
        const roulette = document.getElementById('roulette');
        const spinButton = document.getElementById('spinButton');
        const rouletteWrapper = document.getElementById('rouletteWrapper');

        const segments = [
            { text: '項目1', color: '#FFB3BA' },
            { text: '項目2', color: '#FFDFBA' },
            { text: '項目3', color: '#FFFFBA' },
            { text: '項目4', color: '#BAFFC9' },
            { text: '項目5', color: '#BAE1FF' },
            { text: '項目6', color: '#D4BAFF' },
            { text: '項目7', color: '#FFBAF3' },
            { text: '項目8', color: '#FFD4E5' }
        ];

        // Canvasの drawRoulette() を SVG生成関数に変更
        function drawRoulette() {
            const svgNS = 'http://www.w3.org/2000/svg';
            const centerX = 250; // viewBox (500) の半分
            const centerY = 250; // viewBox (500) の半分
            const radius = 250;  // viewBox (500) の半分
            const anglePerSegment = (2 * Math.PI) / segments.length;

            const gSegments = document.createElementNS(svgNS, 'g');
            svg.appendChild(gSegments);

            segments.forEach((segment, i) => {
                // Canvasの描画開始角度 (-PI/2) を基準に計算
                const startAngle = i * anglePerSegment - Math.PI / 2; 
                const endAngle = startAngle + anglePerSegment;
                const textAngle = startAngle + anglePerSegment / 2;

                // --- 扇形のパス (SVG <path> で描画) ---
                const x1 = centerX + Math.cos(startAngle) * radius;
                const y1 = centerY + Math.sin(startAngle) * radius;
                const x2 = centerX + Math.cos(endAngle) * radius;
                const y2 = centerY + Math.sin(endAngle) * radius;
                const largeArcFlag = anglePerSegment > Math.PI ? 1 : 0;

                // M = MoveTo, L = LineTo, A = Arc, Z = ClosePath
                const pathData = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;

                const path = document.createElementNS(svgNS, 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', segment.color);
                // Canvasの境界線 (stroke) を再現
                path.setAttribute('stroke', 'rgba(255, 255, 255, 0.6)');
                path.setAttribute('stroke-width', '4');
                gSegments.appendChild(path);

                // --- テキスト (SVG <g> と <text> で描画) ---
                const gText = document.createElementNS(svgNS, 'g');
                
                // Canvasの角度 (ラジアン, 真上= -PI/2) を SVGの角度 (度数, 真右=0) に変換
                // Canvasの `rotate(angle)` は (0,0) を中心に回転
                // SVGの `rotate(deg)` は (0,0) を中心に回転
                // Canvasの `translate(cx, cy)` + `rotate(rad)` を SVGの `transform` で再現
                const svgAngleDeg = (textAngle * 180 / Math.PI); // Canvasのラジアン角度を度数に
                
                // `translate` して `rotate` することで、Canvasの描画ロジックを模倣
                gText.setAttribute('transform', `translate(${centerX} ${centerY}) rotate(${svgAngleDeg})`);

                const textRadius = radius * 0.65; // Canvasの x = radius * 0.65

                // 影 (Canvasの y = 12)
                const textShadow = document.createElementNS(svgNS, 'text');
                textShadow.setAttribute('x', textRadius);
                textShadow.setAttribute('y', 12);
                textShadow.setAttribute('fill', 'rgba(0, 0, 0, 0.15)');
                textShadow.setAttribute('font', 'bold 30px Arial');
                textShadow.setAttribute('text-anchor', 'middle');
                textShadow.textContent = segment.text;
                gText.appendChild(textShadow);

                // 本体 (Canvasの y = 10)
                const text = document.createElementNS(svgNS, 'text');
                text.setAttribute('x', textRadius);
                text.setAttribute('y', 10);
                text.setAttribute('fill', '#333333');
                text.setAttribute('font', 'bold 30px Arial');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = segment.text;
                gText.appendChild(text);
                
                gSegments.appendChild(gText);
            });
        }

        drawRoulette(); // SVGを描画

        let currentRotation = 0;
        let isSpinning = false;

        // 回転ロジックは Canvas 版と全く同じ
        spinButton.addEventListener('click', () => {
            if (isSpinning) return;
            
            isSpinning = true;
            spinButton.disabled = true;
            rouletteWrapper.classList.add('spinning');

            const spins = 5 + Math.random() * 4;
            const extraDegrees = Math.random() * 360;
            const totalRotation = currentRotation + (spins * 360) + extraDegrees;

            roulette.style.transform = `rotate(${totalRotation}deg)`;
            currentRotation = totalRotation % 360;

            setTimeout(() => {
                isSpinning = false;
                spinButton.disabled = false;
                rouletteWrapper.classList.remove('spinning');
            }, 5000);
        });
    </script>
</body>
</html>
