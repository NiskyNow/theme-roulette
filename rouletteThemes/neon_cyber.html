<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオンルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 背景を黒から透過に変更 */
            background: transparent;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* body::before (背景グリッド) を削除 */
        /* @keyframes grid-move を削除 */

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            z-index: 1;
        }

        /* .title (タイトル) 関連のCSSを削除 */
        /* @keyframes neon-flicker を削除 */

        .roulette-wrapper {
            position: relative;
            width: 550px;
            height: 550px;
            filter: drop-shadow(0 0 50px rgba(0, 255, 255, 0.5));
        }

        .roulette-border {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 580px;
            height: 580px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                inset 0 0 20px #00ffff;
            animation: border-pulse 2s ease-in-out infinite;
        }

        @keyframes border-pulse {
            0%, 100% {
                box-shadow: 
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    inset 0 0 20px #00ffff;
            }
            50% {
                box-shadow: 
                    0 0 30px #ff00ff,
                    0 0 60px #ff00ff,
                    inset 0 0 30px #ff00ff;
            }
        }

        .roulette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        .roulette svg {
            width: 100%;
            height: 100%;
        }

        .segment-path {
            stroke: #000000;
            stroke-width: 3;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .segment-text {
            font-size: 22px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            fill: white;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 1));
        }

        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            z-index: 10;
        }

        .center-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #ff00ff;
            box-shadow: 
                0 0 15px #ff00ff,
                inset 0 0 15px #ff00ff;
            animation: spin-slow 10s linear infinite;
        }

        .center-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a3e 0%, #0a0a1e 100%);
            border: 2px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px rgba(0, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-icon {
            font-size: 28px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background: linear-gradient(180deg, #ff00ff 0%, #00ffff 100%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            box-shadow: 
                0 0 20px #ff00ff,
                0 0 40px #00ffff;
            z-index: 20;
            animation: pointer-glow 1s ease-in-out infinite alternate;
        }

        @keyframes pointer-glow {
            from {
                box-shadow: 
                    0 0 20px #ff00ff,
                    0 0 40px #00ffff;
            }
            to {
                box-shadow: 
                    0 0 30px #ff00ff,
                    0 0 60px #00ffff,
                    0 0 80px #ff00ff;
            }
        }

        .button {
            padding: 18px 70px;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            border: 3px solid #00ffff;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 
                0 0 20px #00ffff,
                0 0 40px #ff00ff,
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }

        .button::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            z-index: -1;
            filter: blur(10px);
            opacity: 0.7;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px #00ffff,
                0 0 60px #ff00ff,
                inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* .result (結果表示) 関連のCSSを削除 */
        /* @keyframes result-glow を削除 */

        /* .scan-line (スキャンライン) 関連のCSSを削除 */
        /* @keyframes scan を削除 */
        
    </style>
</head>
<body>
    <div class="container">
        <div class="roulette-wrapper">
            <div class="roulette-border"></div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette">
                <svg viewBox="0 0 550 550" id="rouletteSvg"></svg>
                <div class="center-hub">
                    <div class="center-outer"></div>
                    <div class="center-inner">
                        <div class="center-icon">💫</div>
                    </div>
                </div>
            </div>
        </div>
        <button class="button" id="spinBtn" onclick="spin()">START</button>
        </div>

    <script>
        const segments = 5;
        const items = ['激辛お菓子', 'サイン\nチェキ', '歌います', 'メッセージ\n動画', '踊ります'];
        const colors = ['#ff0066', '#00ff88', '#ffaa00', '#0088ff', '#aa00ff'];
        
        const roulette = document.getElementById('roulette');
        const svg = document.getElementById('rouletteSvg');
        // const result = document.getElementById('result'); // 削除
        const spinBtn = document.getElementById('spinBtn');
        
        const centerX = 275;
        const centerY = 275;
        const radius = 265;
        const anglePerSegment = 360 / segments;
        
        function createSegmentPath(index) {
            const startAngle = (index * anglePerSegment - 90) * Math.PI / 180;
            const endAngle = ((index + 1) * anglePerSegment - 90) * Math.PI / 180;
            
            const x1 = centerX + radius * Math.cos(startAngle);
            const y1 = centerY + radius * Math.sin(startAngle);
            const x2 = centerX + radius * Math.cos(endAngle);
            const y2 = centerY + radius * Math.sin(endAngle);
            
            const largeArc = anglePerSegment > 180 ? 1 : 0;
            
            return `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        }
        
        for (let i = 0; i < segments; i++) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', createSegmentPath(i));
            path.setAttribute('fill', colors[i]);
            path.setAttribute('class', 'segment-path');
            svg.appendChild(path);
            
            const angle = (i * anglePerSegment + anglePerSegment / 2 - 90) * Math.PI / 180;
            const textRadius = radius * 0.65;
            const textX = centerX + textRadius * Math.cos(angle);
            const textY = centerY + textRadius * Math.sin(angle);
            
            const lines = items[i].split('\n');
            
            if (lines.length > 1) {
                lines.forEach((line, lineIndex) => {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', textX);
                    text.setAttribute('y', textY + (lineIndex - 0.5) * 26);
                    text.setAttribute('class', 'segment-text');
                    text.textContent = line;
                    svg.appendChild(text);
                });
            } else {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('class', 'segment-text');
                text.textContent = items[i];
                svg.appendChild(text);
            }
        }
        
        let isSpinning = false;
        let currentRotation = 0;
        
        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            // result.textContent = ''; // 削除
            
            const spins = 6 + Math.random() * 3;
            const extraDegrees = Math.random() * 360;
            const totalRotation = currentRotation + (spins * 360) + extraDegrees;
            
            roulette.style.transform = `translate(-50%, -50%) rotate(${totalRotation}deg)`;
            currentRotation = totalRotation % 360;
            
            setTimeout(() => {
                const segmentAngle = 360 / segments;
                const normalizedRotation = (360 - (currentRotation % 360)) % 360;
                const winningIndex = Math.floor(normalizedRotation / segmentAngle);
                
                // result.textContent = `>>> ${items[winningIndex].replace('\n', '')} <<<`; // 削除

                // 結果をコンソールに出力（確認用）
                console.log("結果:", items[winningIndex].replace('\n', ' ')); 

                isSpinning = false;
                spinBtn.disabled = false;
            }, 5000);
        }
    </script>
</body>
</html>
