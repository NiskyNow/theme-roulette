<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アーケードルーレット (修正版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ▼▼▼ 修正 ▼▼▼ */
            background: transparent; /* 背景を透明に */
            /* ▲▲▲ 修正 ▲▲▲ */
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }

        /* ▼▼▼ 削除 ▼▼▼ */
        /* body::before { ... } と @keyframes scanline { ... } を削除 */
        /* ▲▲▲ 削除 ▲▲▲ */

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* ボタンとルーレットの隙間 */
            z-index: 1;
        }

        .roulette-wrapper {
            position: relative;
            width: 580px;
            height: 580px;
        }

        

        .led-lights {
            position: absolute;
            border-radius: 50%;
            animation: led-blink 1s ease-in-out infinite;
        }

        .led-1 { top: 2%; left: 10%; width: 15px; height: 15px; background: #ff0000; box-shadow: 0 0 15px #ff0000; animation-delay: 0s; }
        .led-2 { top: 2%; right: 10%; width: 15px; height: 15px; background: #ffff00; box-shadow: 0 0 15px #ffff00; animation-delay: 0.2s; }
        .led-3 { bottom: 2%; left: 10%; width: 15px; height: 15px; background: #00ff00; box-shadow: 0 0 15px #00ff00; animation-delay: 0.4s; }
        .led-4 { bottom: 2%; right: 10%; width: 15px; height: 15px; background: #00ffff; box-shadow: 0 0 15px #00ffff; animation-delay: 0.6s; }

        @keyframes led-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .roulette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 580px;
            height: 580px;
            border-radius: 50%;
            background: #0f3460;
            border: 5px solid #00ff00;
            box-shadow: 
                0 0 30px rgba(0, 255, 0, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        .roulette svg {
            width: 100%;
            height: 100%;
        }

        .segment-path {
            stroke: #00ff00;
            stroke-width: 4;
        }

        .segment-text {
            font-size: 26px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            fill: #ffffff;
            filter: drop-shadow(2px 2px 0 #000000);
            font-family: 'Courier New', monospace;
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            z-index: 10;
        }

        .button-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                repeating-conic-gradient(
                    from 0deg,
                    #ff0000 0deg 45deg,
                    #ffff00 45deg 90deg,
                    #00ff00 90deg 135deg,
                    #00ffff 135deg 180deg,
                    #0000ff 180deg 225deg,
                    #ff00ff 225deg 270deg,
                    #ff0000 270deg 315deg,
                    #ffff00 315deg 360deg
                );
            border-radius: 50%;
            animation: rainbow-spin 3s linear infinite;
            opacity: 0.8;
        }

        @keyframes rainbow-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .button-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 75%;
            border-radius: 50%;
            background: #1a1a2e;
            border: 4px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            animation: pulse-green 1s ease-in-out infinite;
        }

        @keyframes pulse-green {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(0, 255, 0, 0.5),
                    inset 0 0 20px rgba(0, 0, 0, 0.8);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(0, 255, 0, 0.8),
                    inset 0 0 30px rgba(0, 0, 0, 0.6);
            }
        }

        .pointer {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 50px solid #ff0000;
            filter: drop-shadow(0 0 15px #ff0000);
            z-index: 20;
            animation: pointer-glow 0.5s ease-in-out infinite;
        }

        @keyframes pointer-glow {
            from {
                filter: drop-shadow(0 0 15px #ff0000);
            }
            to {
                filter: drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 35px #ff0000);
            }
        }

        .button {
            padding: 18px 70px;
            font-size: 32px;
            font-weight: bold;
            color: #000000;
            background: linear-gradient(180deg, #ffff00 0%, #ff8800 100%);
            border: 5px solid #00ff00;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 
                5px 5px 0 #008800,
                0 0 30px rgba(0, 255, 0, 0.5);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            position: relative;
        }

        .button::before {
            content: '▶';
            position: absolute;
            left: 20px;
            animation: arrow-flash 0.8s ease-in-out infinite;
        }

        .button::after {
            content: '◀';
            position: absolute;
            right: 20px;
            animation: arrow-flash 0.8s ease-in-out infinite;
            animation-delay: 0.4s;
        }

        @keyframes arrow-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                7px 7px 0 #008800,
                0 0 40px rgba(0, 255, 0, 0.7);
        }

        .button:active {
            transform: translate(3px, 3px);
            box-shadow: 
                2px 2px 0 #008800,
                0 0 20px rgba(0, 255, 0, 0.3);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="roulette-wrapper">
            <div class="arcade-frame">
                <div class="led-lights led-1"></div>
                <div class="led-lights led-2"></div>
                <div class="led-lights led-3"></div>
                <div class="led-lights led-4"></div>
            </div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette">
                <svg viewBox="0 0 580 580" id="rouletteSvg"></svg>
                <div class="center-button">
                    <div class="button-outer"></div>
                    <div class="button-inner">START</div>
                </div>
            </div>
        </div>
        
        <button class="button" id="spinBtn" onclick="spin()">PRESS START</button>
    </div>

    <script>
        const segments = 5;
        const items = ['激辛お菓子', 'サイン\nチェキ', '歌います', 'メッセージ\n動画', '踊ります'];
        const colors = ['#ff0000', '#0000ff', '#00ff00', '#ffff00', '#ff00ff'];
        
        const roulette = document.getElementById('roulette');
        const svg = document.getElementById('rouletteSvg');
        const spinBtn = document.getElementById('spinBtn');
        
        const centerX = 290;
        const centerY = 290;
        const radius = 280;
        const anglePerSegment = 360 / segments;
        
        function createSegmentPath(index) {
            const startAngle = (index * anglePerSegment - 90) * Math.PI / 180;
            const endAngle = ((index + 1) * anglePerSegment - 90) * Math.PI / 180;
            
            const x1 = centerX + radius * Math.cos(startAngle);
            const y1 = centerY + radius * Math.sin(startAngle);
            const x2 = centerX + radius * Math.cos(endAngle);
            const y2 = centerY + radius * Math.sin(endAngle);
            
            const largeArc = anglePerSegment > 180 ? 1 : 0;
            
            return `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        }
        
        for (let i = 0; i < segments; i++) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', createSegmentPath(i));
            path.setAttribute('fill', colors[i]);
            path.setAttribute('class', 'segment-path');
            svg.appendChild(path);
            
            const angle = (i * anglePerSegment + anglePerSegment / 2 - 90) * Math.PI / 180;
            const textRadius = radius * 0.65;
            const textX = centerX + textRadius * Math.cos(angle);
            const textY = centerY + textRadius * Math.sin(angle);
            
            const lines = items[i].split('\n');
            
            if (lines.length > 1) {
                lines.forEach((line, lineIndex) => {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', textX);
                    text.setAttribute('y', textY + (lineIndex - 0.5) * 30);
                    text.setAttribute('class', 'segment-text');
                    text.textContent = line;
                    svg.appendChild(text);
                });
            } else {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('class', 'segment-text');
                text.textContent = items[i];
                svg.appendChild(text);
            }
        }
        
        let isSpinning = false;
        let currentRotation = 0;
        
        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            const spins = 5 + Math.random() * 3;
            const extraDegrees = Math.random() * 360;
            const totalRotation = currentRotation + (spins * 360) + extraDegrees;
            
            roulette.style.transform = `translate(-50%, -50%) rotate(${totalRotation}deg)`;
            currentRotation = totalRotation % 360;
            
            setTimeout(() => {
                const segmentAngle = 360 / segments;
                const normalizedRotation = (360 - (currentRotation % 360)) % 360;
                const winningIndex = Math.floor(normalizedRotation / segmentAngle);
                
                alert("結果: " + items[winningIndex].replace('\n', ''));

                isSpinning = false;
                spinBtn.disabled = false;
            }, 4500);
        }
    </script>
</body>
</html>
