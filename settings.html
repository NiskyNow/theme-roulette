<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルーレット設定</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<style>
    /* (user_170 のCSS... 長いので省略... 変更なし) */
    .swal2-popup { font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    input, button, select, textarea { font-family: inherit; }
    html, body { height: 100%; font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif; background: #F9F5F0; color: #5A4A42; overflow: hidden; }
    .app-container { height: 100%; display: flex; flex-direction: column; }
    .header { background: #F9F5F0; padding: 16px 24px; box-shadow: 4px 4px 8px rgba(217, 210, 201, 0.6), -4px -4px 8px rgba(255, 255, 255, 0.9); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; position: relative; z-index: 10; }
    .header-title { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #5A4A42 0%, #7A6A62 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
    .profile-manager { display: flex; align-items: center; gap: 8px; }
    .profile-manager label { font-size: 13px; font-weight: 600; color: #5A4A42; }
    #profile-select { padding: 8px 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; min-width: 150px; background: #F9F5F0; cursor: pointer; transition: all 0.3s ease; box-shadow: inset 3px 3px 6px rgba(217, 210, 201, 0.7), inset -3px -3px 6px rgba(255, 255, 255, 0.9); }
    #profile-select:focus { outline: none; }
    .btn-profile { padding: 8px 14px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 4px 4px 8px rgba(217, 210, 201, 0.6), -4px -4px 8px rgba(255, 255, 255, 0.9); }
    .btn-profile:active { box-shadow: inset 2px 2px 4px rgba(217, 210, 201, 0.7), inset -2px -2px 4px rgba(255, 255, 255, 0.9); transform: translateY(1px); }
    .btn-profile.btn-new { background: #A1D8D4; color: white; }
    .btn-profile.btn-rename { background: #A4D7E2; color: white; }
    .btn-profile.btn-delete { background: #F8C6C3; color: white; }
    .main-container { display: flex; flex: 1; overflow: visible; padding: 16px; gap: 16px; min-height: 0; }
    .left-panel { flex: 1; background: #F9F5F0; border-radius: 16px; padding: 24px; box-shadow: inset 4px 4px 8px rgba(217, 210, 201, 0.7), inset -4px -4px 8px rgba(255, 255, 255, 0.9); position: relative; z-index: 0; display: flex; flex-direction: column; min-height: 0; }
    .right-panel { width: 340px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
    .card { background: #F9F5F0; border-radius: 16px; padding: 24px; box-shadow: 8px 8px 16px rgba(217, 210, 201, 0.6), -8px -8px 16px rgba(255, 255, 255, 0.9); flex-shrink: 0; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .card h2 { font-size: 18px; font-weight: 700; color: #5A4A42; margin: 0; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
    .section-title { font-size: 20px; font-weight: 700; color: #5A4A42; }
    .total-prob { padding: 10px 16px; background: #A1D8D4; color: white; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 4px 4px 8px rgba(217, 210, 201, 0.6), -4px -4px 8px rgba(255, 255, 255, 0.9); }
    
    /* ▼▼▼ 修正 (v1.3.4) 「色」の列を削除 ▼▼▼ */
    .items-grid { display: grid; grid-template-columns: 40px 1fr 120px 50px; gap: 8px; }
    /* ▲▲▲ 修正 ▲▲▲ */
    
    .column-labels { padding: 8px 4px; background: transparent; margin-bottom: 8px; align-items: center; flex-shrink: 0; }
    .column-label { font-size: 12px; font-weight: 700; color: #7A6A62; text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .column-label.text-left { justify-content: flex-start; padding-left: 8px; }
    .items-container { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; padding-right: 8px; }
    .item-card { background: #F9F5F0; border: none; border-radius: 12px; padding: 12px; align-items: center; transition: all 0.3s ease; box-shadow: 6px 6px 12px rgba(217, 210, 201, 0.6), -6px -6px 12px rgba(255, 255, 255, 0.9); }
    .item-card:hover { box-shadow: 8px 8px 16px rgba(217, 210, 201, 0.6), -8px -8px 16px rgba(255, 255, 255, 0.9); transform: translateY(-1px); }
    .item-index { width: 36px; height: 36px; background: #F3EBE0; color: #7A6A62; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: inset 2px 2px 4px rgba(217, 210, 201, 0.7), inset -2px -2px 4px rgba(255, 255, 255, 0.9); }
    .item-name-input, .prob-input { padding: 10px 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.3s ease; width: 100%; background: #F9F5F0; box-shadow: inset 3px 3px 6px rgba(217, 210, 201, 0.7), inset -3px -3px 6px rgba(255, 255, 255, 0.9); }
    .item-name-input:focus, .prob-input:focus { outline: none; }
    .prob-display { text-align: center; font-weight: 700; font-size: 16px; color: #6BAAC0; padding: 8px; }
    .prob-input { text-align: center; }
    .delete-btn-wrapper { display: flex; justify-content: center; }
    .delete-btn { width: 40px; height: 40px; background: transparent; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease; }
    .delete-btn:hover { background: #F3EBE0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; color: white; cursor: pointer; transition: all 0.3s ease; margin-top: 12px; box-shadow: 8px 8px 16px rgba(217, 210, 201, 0.6), -8px -8px 16px rgba(255, 255, 255, 0.9); }
    .btn:active { box-shadow: inset 4px 4px 8px rgba(217, 210, 201, 0.7), inset -4px -4px 8px rgba(255, 255, 255, 0.9); transform: translateY(2px); }
    .btn-primary { background: #A1D8D4; }
    .btn-secondary { background: #6BAAC0; }
    .btn-danger { background: #F4A98B; }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px; border-radius: 8px; transition: all 0.3s ease; }
    .checkbox-label:hover { background: #F3EBE0; }
    .checkbox-label input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 5px; background: #F9F5F0; box-shadow: inset 2px 2px 4px rgba(217, 210, 201, 0.7), inset -2px -2px 4px rgba(255, 255, 255, 0.9); cursor: pointer; position: relative; }
    .checkbox-label input[type="checkbox"]:checked { background: #A1D8D4; box-shadow: 4px 4px 8px rgba(217, 210, 201, 0.6), -4px -4px 8px rgba(255, 255, 255, 0.9); }
    .checkbox-label span { font-size: 14px; font-weight: 500; color: #5A4A42; }
    .tooltip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #E0D9D2; color: white; border-radius: 50%; text-align: center; font-size: 12px; font-weight: 700; cursor: help; transition: all 0.3s ease; flex-shrink: 0; }
    .tooltip:hover { background: #6BAAC0; transform: scale(1.1); }
    .tooltip::before { content: attr(data-tooltip); position: absolute; bottom: 130%; right: 0; background: #5A4A42; color: white; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; line-height: 1.5; width: 280px; text-align: left; white-space: normal; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 100; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); pointer-events: none; }
    .tooltip::after { content: ''; position: absolute; bottom: 130%; right: 10px; margin-bottom: -8px; border-width: 8px; border-style: solid; border-color: #5A4A42 transparent transparent transparent; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 100; }
    .tooltip:hover::before, .tooltip:hover::after { opacity: 1; visibility: visible; }
    .tooltip.tooltip-on-left::before { bottom: 50%; top: auto; right: 120%; left: auto; transform: translateY(50%); }
    .tooltip.tooltip-on-left::after { bottom: 50%; top: auto; right: 100%; left: auto; margin-bottom: 0; margin-right: -8px; transform: translateY(50%); border-color: transparent transparent transparent #5A4A42; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #F3EBE0; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #E0D9D2; border-radius: 10px; border: 3px solid #F3EBE0; }
    ::-webkit-scrollbar-thumb:hover { background: #D1C8BF; }
    #save-status { margin-top: 12px; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; display: none; }
    #save-status.success { background: #d4edda; color: #155724; display: block; }
    #save-status.error { background: #f8d7da; color: #721c24; display: block; }
    
    #theme-select {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        background: #F9F5F0;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: inset 3px 3px 6px rgba(217, 210, 201, 0.7), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
    }
</style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 class="header-title">🎡 ルーレット設定</h1>
        <div class="profile-manager">
            <label for="profile-select">プロファイル:</label>
            <select id="profile-select"></select>
            <button class="btn-profile btn-new">新規</button>
            <button class="btn-profile btn-rename">名前変更</button>
            <button class="btn-profile btn-delete">削除</button>
        </div>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="section-header">
                <h2 class="section-title" id="items-header">📝 項目の設定</h2>
                <div class="total-prob" id="total-prob-display">合計確率: 100%</div>
            </div>
            
            <div class="column-labels items-grid">
                <div class="column-label"></div>
                <div class="column-label text-left">項目名</div>
                <div class="column-label">重み (Weight)<span class="tooltip" data-tooltip="「重み」の比率で確率が自動計算されます。重み10と重み20の項目がある場合、当選確率は 33.3% と 66.6% になります。">?</span></div>
                <div class="column-label"></div>
            </div>
            
            <div class="items-container" id="items-list-container">
                </div>
            <button id="add-item-btn" class="btn btn-primary" style="flex-shrink: 0; margin-top: 16px;">➕ 項目を追加</button>
        </div>

        <div class="right-panel">
            
            <div class="card">
                <h2>🎨 テーマ選択</h2>
                <select id="theme-select" style="margin-top: 12px;">
                    
                </select>
            </div>
            <div class="card">
                <h2>⚙️ その他設定</h2>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="fake-enabled">
                        <span>フェイク演出を有効にする</span>
                        <span class="tooltip tooltip-on-left" style="margin-left: auto;" 
                              data-tooltip="当選結果を一度通り過ぎてから戻ってくる、ドキドキの演出です。この演出は33%の確率で発生します。">?</span>
                    </label>
                </div>
            </div>
            <div class="card">
                <h2>💾 保存 / 実行</h2>
                <button id="save-btn" class="btn btn-danger">設定を保存</button>
                <div id="save-status"></div>
                <button id="open-roulette-btn" class="btn btn-secondary">🎡 ルーレットを実行/更新</button>
                </div>
        </div>
    </div>
</div>

<script src="./settingsRenderer.js"></script>

<template id="item-template">
    <div class="item-card items-grid" data-index="0">
        <div class="item-index">1</div>
        <input class="item-name-input" type="text" placeholder="項目名 (必須)">
        <input type="number" placeholder="自動計算" class="prob-input prob-manual-input" min="0" step="1">
        <div class="delete-btn-wrapper">
            <button class="delete-btn">🗑️</button>
        </div>
    </div>
</template>

</body>
</html>
