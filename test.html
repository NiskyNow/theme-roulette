<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コスミックルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, #1b1464 0%, #0a0a1f 50%, #000000 100%);
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: shoot linear;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(300px) translateY(300px);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 45px;
            z-index: 1;
        }

        .title {
            font-size: 58px;
            font-weight: normal;
            background: linear-gradient(135deg, #667eea 0%, #a78bfa 25%, #ec4899 50%, #fbbf24 75%, #667eea 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(167, 139, 250, 0.6));
            letter-spacing: 8px;
            animation: gradient-flow 8s ease infinite;
            font-style: italic;
        }

        @keyframes gradient-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .constellation-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .constellation-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.4), transparent);
            height: 1px;
            transform-origin: left center;
            animation: line-glow 3s ease-in-out infinite;
        }

        @keyframes line-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .roulette-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.3);
            animation: orbit-rotate linear infinite;
            background: radial-gradient(ellipse at center, rgba(27, 20, 100, 0.3) 0%, rgba(10, 10, 31, 0.2) 50%, rgba(0, 0, 0, 0.1) 100%);
        }

        .orbit-1 {
            width: 650px;
            height: 650px;
            animation-duration: 40s;
        }

        .orbit-2 {
            width: 680px;
            height: 680px;
            animation-duration: 50s;
            animation-direction: reverse;
        }

        .orbit-3 {
            width: 710px;
            height: 710px;
            animation-duration: 60s;
        }

        @keyframes orbit-rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .planet {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: planet-pulse 2s ease-in-out infinite;
        }

        @keyframes planet-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px currentColor;
            }
            50% {
                transform: scale(1.3);
                box-shadow: 0 0 25px currentColor;
            }
        }

        .outer-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 630px;
            height: 630px;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(27, 20, 100, 0.4) 0%,
                rgba(10, 10, 31, 0.3) 60%, 
                rgba(167, 139, 250, 0.1) 70%, 
                transparent 80%);
            animation: glow-pulse 4s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                box-shadow: 0 0 50px rgba(167, 139, 250, 0.4);
            }
            50% {
                box-shadow: 0 0 80px rgba(167, 139, 250, 0.7);
            }
        }

        .roulette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(27, 20, 100, 0.6) 0%, rgba(10, 10, 31, 0.9) 100%);
            border: 2px solid rgba(167, 139, 250, 0.5);
            box-shadow: 
                0 0 60px rgba(167, 139, 250, 0.3),
                inset 0 0 80px rgba(0, 0, 0, 0.8);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        .roulette svg {
            width: 100%;
            height: 100%;
        }

        .segment-path {
            stroke: rgba(167, 139, 250, 0.4);
            stroke-width: 2;
            opacity: 0.95;
        }

        .segment-text {
            font-size: 24px;
            font-weight: normal;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            fill: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8));
            font-family: 'Georgia', serif;
        }

        .center-nebula {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 10;
        }

        .nebula-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 50% 50%, 
                    rgba(167, 139, 250, 0.6) 0%, 
                    rgba(236, 72, 153, 0.4) 30%, 
                    rgba(251, 191, 36, 0.3) 60%, 
                    transparent 100%);
            animation: nebula-swirl 10s linear infinite;
            filter: blur(3px);
        }

        @keyframes nebula-swirl {
            from { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            to { transform: rotate(360deg) scale(1); }
        }

        .nebula-middle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 10, 31, 0.9) 0%, rgba(27, 20, 100, 0.8) 100%);
            border: 2px solid rgba(167, 139, 250, 0.6);
            box-shadow: 
                0 0 30px rgba(167, 139, 250, 0.5),
                inset 0 0 30px rgba(167, 139, 250, 0.2);
        }

        .nebula-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            height: 55%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, rgba(167, 139, 250, 0.9) 50%, rgba(10, 10, 31, 0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: core-glow 3s ease-in-out infinite;
        }

        @keyframes core-glow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 255, 255, 1), 0 0 70px rgba(167, 139, 250, 0.8);
            }
        }

        .pointer {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 70px;
            background: linear-gradient(180deg, #fbbf24 0%, #ec4899 50%, #667eea 100%);
            clip-path: polygon(50% 100%, 30% 40%, 35% 0%, 65% 0%, 70% 40%);
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.8));
            z-index: 20;
            animation: pointer-shimmer 2s ease-in-out infinite;
        }

        @keyframes pointer-shimmer {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.8));
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(251, 191, 36, 1)) drop-shadow(0 0 50px rgba(236, 72, 153, 0.8));
            }
        }

        .pointer::before {
            content: '✦';
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #fbbf24;
            font-size: 32px;
            animation: star-sparkle 1.5s ease-in-out infinite;
        }

        @keyframes star-sparkle {
            0%, 100% {
                transform: translateX(-50%) scale(1) rotate(0deg);
                text-shadow: 0 0 15px #fbbf24;
            }
            50% {
                transform: translateX(-50%) scale(1.4) rotate(180deg);
                text-shadow: 0 0 30px #fbbf24, 0 0 50px #ec4899;
            }
        }

        .button {
            padding: 20px 70px;
            font-size: 26px;
            font-weight: normal;
            color: #ffffff;
            background: linear-gradient(135deg, 
                rgba(27, 20, 100, 0.8) 0%, 
                rgba(10, 10, 31, 0.9) 50%, 
                rgba(0, 0, 0, 0.8) 100%),
                linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(167, 139, 250, 0.3) 50%, rgba(236, 72, 153, 0.3) 100%);
            background-blend-mode: normal, screen;
            border: 2px solid rgba(167, 139, 250, 0.8);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 0 40px rgba(167, 139, 250, 0.4),
                inset 0 0 30px rgba(167, 139, 250, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 6px;
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: button-shimmer 3s linear infinite;
        }

        @keyframes button-shimmer {
            from { left: -100%; }
            to { left: 200%; }
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 60px rgba(167, 139, 250, 0.7),
                inset 0 0 40px rgba(167, 139, 250, 0.2);
            border-color: rgba(236, 72, 153, 0.8);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .result {
            font-size: 42px;
            font-weight: normal;
            background: linear-gradient(135deg, #667eea 0%, #a78bfa 50%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.8));
            min-height: 55px;
            letter-spacing: 4px;
            animation: result-float 1s ease-out;
            font-style: italic;
        }

        @keyframes result-float {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result::before,
        .result::after {
            content: '★';
            margin: 0 20px;
            animation: result-star-spin 3s linear infinite;
            display: inline-block;
        }

        @keyframes result-star-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>
    <div class="container">
        <div class="title">Stellar Fortune</div>
        <div class="roulette-wrapper">
            <div class="orbit orbit-1">
                <div class="planet" style="background: #667eea; top: 0%; left: 50%; transform: translate(-50%, -50%);"></div>
            </div>
            <div class="orbit orbit-2">
                <div class="planet" style="background: #ec4899; top: 50%; right: 0%; transform: translate(50%, -50%);"></div>
            </div>
            <div class="orbit orbit-3">
                <div class="planet" style="background: #fbbf24; bottom: 0%; left: 50%; transform: translate(-50%, 50%);"></div>
            </div>
            <div class="outer-glow"></div>
            <div class="pointer"></div>
            <div class="roulette" id="roulette">
                <svg viewBox="0 0 600 600" id="rouletteSvg"></svg>
                <div class="center-nebula">
                    <div class="nebula-outer"></div>
                    <div class="nebula-middle"></div>
                    <div class="nebula-core">✨</div>
                </div>
            </div>
        </div>
        <button class="button" id="spinBtn" onclick="spin()">Spin</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        setInterval(() => {
            if (Math.random() > 0.95) {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                shootingStar.style.left = Math.random() * 50 + '%';
                shootingStar.style.top = Math.random() * 50 + '%';
                shootingStar.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                starsContainer.appendChild(shootingStar);
                setTimeout(() => shootingStar.remove(), 2000);
            }
        }, 500);

        const segments = 5;
        const items = ['激辛お菓子', 'サイン\nチェキ', '歌います', 'メッセージ\n動画', '踊ります'];
        const colors = ['#1e3a8a', '#831843', '#065f46', '#92400e', '#581c87'];
        
        const roulette = document.getElementById('roulette');
        const svg = document.getElementById('rouletteSvg');
        const result = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        
        const centerX = 300;
        const centerY = 300;
        const radius = 290;
        const anglePerSegment = 360 / segments;
        
        function createSegmentPath(index) {
            const startAngle = (index * anglePerSegment - 90) * Math.PI / 180;
            const endAngle = ((index + 1) * anglePerSegment - 90) * Math.PI / 180;
            
            const x1 = centerX + radius * Math.cos(startAngle);
            const y1 = centerY + radius * Math.sin(startAngle);
            const x2 = centerX + radius * Math.cos(endAngle);
            const y2 = centerY + radius * Math.sin(endAngle);
            
            const largeArc = anglePerSegment > 180 ? 1 : 0;
            
            return `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        }
        
        for (let i = 0; i < segments; i++) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', createSegmentPath(i));
            path.setAttribute('fill', colors[i]);
            path.setAttribute('class', 'segment-path');
            svg.appendChild(path);
            
            const angle = (i * anglePerSegment + anglePerSegment / 2 - 90) * Math.PI / 180;
            const textRadius = radius * 0.65;
            const textX = centerX + textRadius * Math.cos(angle);
            const textY = centerY + textRadius * Math.sin(angle);
            
            const lines = items[i].split('\n');
            
            if (lines.length > 1) {
                lines.forEach((line, lineIndex) => {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', textX);
                    text.setAttribute('y', textY + (lineIndex - 0.5) * 28);
                    text.setAttribute('class', 'segment-text');
                    text.textContent = line;
                    svg.appendChild(text);
                });
            } else {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('class', 'segment-text');
                text.textContent = items[i];
                svg.appendChild(text);
            }
        }
        
        let isSpinning = false;
        let currentRotation = 0;
        
        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            result.textContent = '';
            result.style.animation = 'none';
            
            const spins = 5 + Math.random() * 3;
            const extraDegrees = Math.random() * 360;
            const totalRotation = currentRotation + (spins * 360) + extraDegrees;
            
            roulette.style.transform = `translate(-50%, -50%) rotate(${totalRotation}deg)`;
            currentRotation = totalRotation % 360;
            
            setTimeout(() => {
                const segmentAngle = 360 / segments;
                const normalizedRotation = (360 - (currentRotation % 360)) % 360;
                const winningIndex = Math.floor(normalizedRotation / segmentAngle);
                
                result.style.animation = 'result-float 1s ease-out';
                result.textContent = items[winningIndex].replace('\n', '');
                isSpinning = false;
                spinBtn.disabled = false;
            }, 5000);
        }
    </script>
</body>
</html>
